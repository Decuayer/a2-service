services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: a2user
      POSTGRES_PASSWORD: a2pass
      POSTGRES_DB: a2db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2user -d a2db"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://a2user:a2pass@db:5432/a2db
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    

volumes:
  pgdata: